{% extends "base.html" %}

{% block title %}Профиль администратора — TutorBook{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container">
        <h1>Профиль администратора</h1>
    </div>
</section>

<section class="profile-section">
    <div class="container">
        <div class="profile-card">
            <h2>Данные аккаунта</h2>
            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/api/profile/update">
                <div class="form-group">
                    <label for="full_name">ФИО</label>
                    <input id="full_name" name="full_name" type="text" value="{{ user.full_name }}" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ user.email }}" required>
                </div>
                <div class="form-group">
                    <label>Роль</label>
                    <input type="text" value="Администратор" disabled>
                </div>
                <div class="auth-footer" style="margin-top: 16px;">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a href="/dashboard" class="btn btn-outline">Админ‑панель</a>
                    <a href="/tutors" class="btn btn-outline">Открыть репетиторов</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}
