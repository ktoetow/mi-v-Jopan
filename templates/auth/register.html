{% extends "base.html" %}

{% block title %}Регистрация — TutorBook{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card">
            <h2>Регистрация</h2>
            <p class="subtitle">Создайте аккаунт за минуту.</p>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form method="post" action="/api/register">
                <div class="form-group">
                    <label for="full_name">ФИО</label>
                    <input id="full_name" name="full_name" type="text" value="{{ full_name or '' }}" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ email or '' }}" required />
                </div>

                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input id="password" name="password" type="password" minlength="6" required />
                </div>

                <div class="form-group">
                    <label for="password_confirm">Повторите пароль</label>
                    <input id="password_confirm" name="password_confirm" type="password" minlength="6" required />
                </div>

                <button type="submit" class="btn btn-primary full-width">Создать аккаунт</button>
            </form>

            <div class="auth-footer">
                <p>Уже есть аккаунт? <a href="/login">Войти</a></p>
                <p>Репетиторы создаются администратором и входят по выданным данным.</p>
            </div>
        </div>
    </div>
</section>
{% endblock %}
